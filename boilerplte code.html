     <!DOCTYPE html> 
<!-- Hey browser, is document ko modern HTML5 rules ke according interpret karo -->
    <html lang="en"> 
<!-- root element : Poore HTML document ka sabse outer/main container -->
<!-- lang = attribute -->
<!-- en   = value -->
    <head>
<!-- mein webpage ki important information/settings hoti hain jo normally webpage ke main visible area mein directly nahi dikhti -->
    <meta charset="UTF-8">
<!-- Is webpage ke text ko UTF-8 character encoding ke according interpret karo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Is line ki wajah se responsive webpages mobile devices par properly behave karne mein help milti hai -->
    <title>document</title>
<!-- title ka text normally webpage ke body ke andar visible nahi hota. -->
    </head>
    <body>
 <!-- body ke andar tumhari webpage ka actual content aata hai.        -->
    </body>
    </html>
