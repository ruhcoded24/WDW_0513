<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMAGE</title>
  </head>
  <body>
    <!-- src m we give link/path -->
    <!-- img tag is used to display image on webpage. It is a self closing tag. It has two attributes src and alt. Src is used to give the path of the image and alt is used to give the alternative text for the image  -->
    <img
      src="https://tse3.mm.bing.net/th/id/OIP.LljCfyqMuOHd3hBKpV41cAHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
      alt="GREENRY"
      width="900px"
      height="600px"
    />
    <img
      src="Screenshot 2026-10-18 232957.png"
      alt="SCANNER"
      width="900px"
      height="600px"
    />
    <!-- ctrl + space for auto-complete -->
    <!-- img+caption=figure -->
    <figure>
            <figcaption>GREENRY</figcaption>
      <img
        src="https://png.pngtree.com/thumb_back/fh260/background/20231228/pngtree-blurry-green-leaf-texture-background-creating-a-natural-ambiance-image_13846678.png"
        alt="GREENRY"
        width="900px"
        height="600px"
      />

    </figure>
  </body>
</html>
