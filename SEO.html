<!-- SEO kya hota hai?

SEO = Search Engine Optimization

Simple language mein:

SEO ka matlab hai apni website ko aise optimize karna ki Google jaise search engines tumhari website ko easily 
understand kar saken aur relevant searches mein users ko dikha saken. -->
<!-- example -->
<head>

    <title>Learn HTML for Beginners</title>

    <meta name="description"
          content="A beginner-friendly guide to learning HTML.">

</head>
<h1>Learn HTML for Beginners</h1>

<h2>What is HTML?</h2>

<p>HTML is the standard markup language for creating webpages.

<!-- <title> → page ka title communicate karta hai
meta description → page ka short description provide karta hai
<h1> → main heading
<h2> → subsection
<p> → actual content -->

    
<!-- 
SEO ka matlab sirf keywords daalna nahi hai.

Google aur other search engines page ke content, structure, relevance, usability, links, and many other 
signals ko consider karte hain.

One-line definition :

SEO = Website ko search engines aur users dono ke liye understandable aur discoverable banana. -->
